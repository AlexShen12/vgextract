<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>League video evidence review</title>
<style>
:root{color-scheme:dark;font:15px system-ui;background:#121923;color:#e9edf2}*{box-sizing:border-box}body{margin:0}header{padding:16px 24px;border-bottom:1px solid #334155;display:flex;gap:16px;align-items:center}h1{font-size:20px;margin:0}select,button,input,textarea{font:inherit;background:#202d3e;color:inherit;border:1px solid #53647a;border-radius:5px;padding:8px}button{cursor:pointer}button:hover{background:#344762}main{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;padding:20px}aside{height:85vh;overflow:auto}.record{display:block;width:100%;text-align:left;margin:5px 0;font-size:13px}.record.active{border-color:#59c6c3;background:#244347}video{width:100%;max-height:54vh;background:black}label{display:block;margin:10px 0}textarea{width:100%;height:180px;font:13px ui-monospace,monospace}#crops{display:flex;overflow:auto;gap:12px}figure{margin:8px 0;min-width:160px}figure img{max-height:210px;max-width:480px;object-fit:contain;background:black}figcaption{font-size:12px;color:#bac7d6}.muted{color:#b1becd;font-size:13px}#notice{padding:8px;color:#ffd28c}#detail{white-space:pre-wrap}#actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}#status{min-height:24px}pre{overflow:auto;max-height:150px;font-size:12px}@media(max-width:850px){main{grid-template-columns:1fr}aside{height:190px}}
</style>
<header><h1>League video evidence review</h1><select id="target"><option value="questions">Questions & answers</option><option value="events">Events</option><option value="observations">HUD observations</option><option value="previews">Layout/crop previews</option></select><button id="refresh">Refresh</button></header>
<main><aside><input id="filter" aria-label="Filter records" placeholder="Filter text or review status"><div id="actions"><button id="previous">Previous</button><button id="next">Next</button><span id="page"></span></div><div id="records"></div></aside><section>
<div class="muted">Review is optional. Unattended generation and evaluation remain available. Only human approval marks a reference as verified.</div><div id="notice"></div>
<video id="video" controls preload="metadata" src="/media/source"></video>
<div id="actions"><button id="seek">Seek to evidence</button><button id="back">−1 frame</button><button id="forward">+1 frame</button><span id="time"></span></div>
<h2 id="title">Select a record</h2><div id="detail"></div><div id="crops"></div>
<label>Corrections (JSON; only fields shown here are editable)<textarea id="changes" spellcheck="false">{}</textarea></label>
<div id="actions"><button data-status="human-verified">Save & verify</button><button data-status="unreviewed">Save as unreviewed</button><button data-status="rejected">Reject</button></div>
<div id="status" role="status"></div><details><summary>Original/effective record and provenance</summary><pre id="raw"></pre></details>
</section></main>
<script>
let records=[],editable=[],selected=null,frames=[],offset=0,total=0,searchTimer;const $=id=>document.getElementById(id),v=$('video');
async function load(){const response=await fetch('/api/records?target='+$('target').value+'&offset='+offset+'&q='+encodeURIComponent($('filter').value));const data=await response.json();records=data.records;editable=data.editable;total=data.total;$('page').textContent=total?`${offset+1}–${offset+records.length} of ${total}`:'No records yet';$('previous').disabled=offset===0;$('next').disabled=offset+records.length>=total;$('notice').textContent=data.invalidated?'Corrections saved. Rerun downstream stages to refresh questions, predictions, and reports.':'';render();if(selected){const current=records.find(r=>r.id===selected.id);if(current){selected=current;$('detail').textContent=current.answer!==undefined?'Reference answer: '+JSON.stringify(current.answer):'Source time: '+(current.time??current.start)+'s';$('raw').textContent=JSON.stringify(current,null,2);}}}
function render(){const filter=$('filter').value.toLowerCase();$('records').replaceChildren();for(const row of records.filter(r=>JSON.stringify(r).toLowerCase().includes(filter))){const b=document.createElement('button');b.className='record'+(selected?.id===row.id?' active':'');const time=row.time??row.start??row.interval?.[0];b.textContent=(row.review_status||'unreviewed')+' · '+(row.prompt||row.route||[row.entity||row.actor,row.field||row.kind].join(' '))+(time!==undefined?' · '+Number(time).toFixed(2)+'s':'');b.onclick=()=>select(row);$('records').append(b);}}
async function select(row){selected=row;render();$('title').textContent=row.prompt||row.route||[row.entity||row.actor,row.field||row.kind].join(' ');$('detail').textContent=row.answer!==undefined?'Reference answer: '+JSON.stringify(row.answer):'Source time: '+(row.time??row.start)+'s';$('changes').value=JSON.stringify(Object.fromEntries(editable.filter(k=>k in row).map(k=>[k,row[k]])),null,2);for(const b of document.querySelectorAll('[data-status]'))b.disabled=!editable.length;$('raw').textContent=JSON.stringify(row,null,2);const data=await(await fetch('/api/evidence/'+row.id)).json();frames=data.frames;$('crops').replaceChildren();for(const f of [...frames.slice(0,16),...data.processed.slice(0,8)]){const figure=document.createElement('figure'),image=document.createElement('img'),caption=document.createElement('figcaption');image.src='/media/'+f.path;image.alt=f.route||'Actual processed model input';caption.textContent=f.route?f.route+' · '+Number(f.time).toFixed(3)+'s':'Processed input · '+f.size.join('×');image.onclick=()=>{if(f.time!==undefined)v.currentTime=f.time};figure.append(image,caption);$('crops').append(figure);}seek();}
function seek(){if(selected)v.currentTime=selected.time??selected.start??frames[0]?.time??selected.interval?.[0]??0;}
$('seek').onclick=seek;$('back').onclick=()=>v.currentTime=Math.max(0,v.currentTime-1/60);$('forward').onclick=()=>v.currentTime+=1/60;v.ontimeupdate=()=>$('time').textContent=v.currentTime.toFixed(3)+' source seconds';$('target').onchange=()=>{selected=null;offset=0;load()};$('refresh').onclick=load;$('filter').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{offset=0;load()},200)};$('previous').onclick=()=>{offset=Math.max(0,offset-200);load()};$('next').onclick=()=>{offset+=200;load()};
for(const button of document.querySelectorAll('[data-status]'))button.onclick=async()=>{if(!selected)return;try{const changes=JSON.parse($('changes').value),response=await fetch('/api/corrections',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target:$('target').value,record_id:selected.id,changes,review_status:button.dataset.status})});const data=await response.json();if(!response.ok)throw new Error(data.detail||'Save failed');$('status').textContent='Saved revision '+data.revision+' · '+data.review_status;await load();}catch(error){$('status').textContent=error.message;}};load();
</script></html>
