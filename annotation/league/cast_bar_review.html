<!doctype html><html lang="en"><meta charset="utf-8"><title>Cast bars and source labels</title>
<style>body{font:16px system-ui;background:#141920;color:#e5edf5;margin:24px;max-width:1400px}button,input,select,textarea{font:inherit;padding:6px;margin:4px;background:#242f3c;color:inherit;border:1px solid #647488}video{width:75%;max-height:60vh}textarea{width:95%;height:260px}img{image-rendering:pixelated;max-width:90%;min-height:60px}pre{white-space:pre-wrap}a{color:#9dccff}.muted{color:#b2bcc6}</style>
<h1>Cast bars</h1><p><a href="/">Review home</a> · <button id="labelsMode">Source labeling</button><button id="readMode">Reader evidence</button></p>
<p class="muted">Labels preserve visible text and cast spans. Cooldown onset, targets and outcomes require separate evidence. Model drafts are not human verification.</p>
<video id="video" controls preload="metadata"></video><p><button id="back">−1 frame</button><button id="forward">+1 frame</button><input id="fps" type="number" value="59.94005994" min="1" step="any"> FPS <span id="time"></span></p>
<select id="choice"></select><select id="reading"></select><button id="seek">Seek</button>
<p id="status"></p><div id="channels" aria-label="Observed channel timeline"></div><img id="crop" alt="Source text crop" hidden><pre id="description"></pre>
<label>Reviewer <input id="reviewer" value=""></label><label><input id="human" type="checkbox">I personally reviewed the source without reader predictions</label>
<textarea id="editor" aria-label="Source label or correction JSON"></textarea><button id="save">Save revision</button><pre id="result"></pre>
<script type="module">
let mode='labels',data,rows=[],clip;const $=id=>document.getElementById(id),v=$('video');
const json=async(url,options)=>{let r=await fetch(url,options);let d=await r.json();if(!r.ok)throw Error(d.detail||JSON.stringify(d));return d};
function options(el,values){el.replaceChildren(...values.map(([value,text])=>{let o=document.createElement('option');o.value=value;o.textContent=text;return o}))}
async function load(){try{if(mode==='labels'){data=await json('/api/cast-dataset');options($('choice'),data.clips.map(c=>[c.id,c.id+' · '+data.sources.find(s=>s.id===c.source_id).split]));$('status').textContent=JSON.stringify(data.coverage);$('reading').hidden=true}else{data=await json('/api/cast-bars');options($('choice'),data.map((e,i)=>[i,e.namespace+'/'+e.id]));$('reading').hidden=false}await select()}catch(e){$('result').textContent=e.message}}
async function select(){if(mode==='labels'){clip=data.clips.find(c=>c.id===$('choice').value);if(!clip)return;v.src='/api/cast-dataset/'+encodeURIComponent(clip.id)+'/source';v.onloadedmetadata=()=>v.currentTime=clip.start;$('editor').value=JSON.stringify(data.labels[clip.id]||{reviewer:'',reviewer_kind:'human',source_only:true,verified:false,human_attestation:false,exhaustive:false,events:[]},null,2);$('description').textContent='Source-only labels. Add event intervals, text/progress boxes, channel_kind, visibility, raw_text, owner_id, champion/ability_id, terminal_status, left_censored and right_censored.';$('crop').hidden=true;$('channels').replaceChildren();rows=[]}else{let e=data[+$('choice').value];if(!e)return;let d=await json('/api/cast-bars/'+e.namespace+'/'+e.id);rows=d.readings;$('channels').replaceChildren(...d.occurrences.map(event=>{let b=document.createElement('button');b.textContent=event.start.toFixed(3)+'–'+event.end.toFixed(3)+' '+(event.ability_id||event.channel_kind);b.onclick=()=>{v.currentTime=event.start;let i=rows.findIndex(r=>r.time>=event.start);if(i>=0){$('reading').value=i;read()}};return b}));options($('reading'),rows.map((r,i)=>[i,r.time.toFixed(3)+' · '+r.raw_text+' · '+r.resolution]));v.src='/media/source';read()}}
function read(){let r=rows[+$('reading').value];if(!r)return;$('crop').hidden=false;$('crop').src='/media/'+r.text_path.split('/').map(encodeURIComponent).join('/');$('description').textContent=(r.description?.name||'Unresolved')+'\n'+(r.description?.description||'')+'\nCatalog '+r.reference_version+(r.description?.communitydragon?'\nCommunityDragon '+r.description.communitydragon.reference_version+'\n'+r.description.communitydragon.description:'');$('editor').value=JSON.stringify(Object.fromEntries(['raw_text','ability_id','channel_kind','visibility','review_status'].map(k=>[k,r[k]])),null,2)}
$('choice').onchange=()=>select().catch(e=>$('result').textContent=e.message);$('reading').onchange=read;$('labelsMode').onclick=()=>{mode='labels';load()};$('readMode').onclick=()=>{mode='read';load()};$('back').onclick=()=>{v.pause();v.currentTime=Math.max(0,v.currentTime-1/+$('fps').value)};$('forward').onclick=()=>{v.pause();v.currentTime+=1/+$('fps').value};v.ontimeupdate=()=>$('time').textContent=v.currentTime.toFixed(6)+' s';$('seek').onclick=()=>v.currentTime=mode==='labels'?clip.start:rows[+$('reading').value].time;
$('save').onclick=async()=>{try{let body=JSON.parse($('editor').value),url;if(mode==='labels'){body.reviewer=$('reviewer').value;body.reviewer_kind='human';body.human_attestation=$('human').checked;body.verified=$('human').checked;url='/api/cast-dataset/'+encodeURIComponent(clip.id)}else{let e=data[+$('choice').value];url='/api/cast-bars/'+e.namespace+'/'+e.id+'/corrections/'+rows[+$('reading').value].id;body={changes:body,reviewer:$('reviewer').value}}$('result').textContent=JSON.stringify(await json(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),null,2)}catch(e){$('result').textContent=e.message}};load();
</script></html>
