<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Champion body evidence</title>
<style>
body { max-width: 65rem; padding: 1rem; margin: auto; font: 1rem system-ui, sans-serif; color: #20262d; }
video { width: 100%; background: #111; }
form { display: flex; gap: .75rem; align-items: center; margin: 1rem 0; flex-wrap: wrap; }
article { border-top: 1px solid #c9cdd2; padding: .75rem 0; }
img { max-width: 10rem; max-height: 9rem; margin-right: .75rem; }
pre { white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
<a href="/">Evidence review</a>
<h1>Champion body evidence</h1>
<video id="source" src="/media/source" controls preload="metadata"></video>
<form id="query">
  <label>Source time in seconds <input id="time" type="number" min="0" step="0.001" value="0"></label>
  <button>Show observations</button>
  <button type="button" id="use-video">Use playback time</button>
</form>
<p id="status" role="status"></p>
<section id="rows"></section>
<script>
const status = document.querySelector("#status");
const rows = document.querySelector("#rows");
const time = document.querySelector("#time");
const source = document.querySelector("#source");
async function load() {
  rows.replaceChildren();
  const response = await fetch("/api/body-identities?" + new URLSearchParams({time: time.value}));
  const result = await response.json();
  if (!response.ok) {
    status.textContent = result.detail;
    return;
  }
  status.textContent = result.experimental ? "Experimental identity evidence" : "Qualified identity evidence";
  for (const row of result.predictions) {
    const article = document.createElement("article");
    const title = document.createElement("strong");
    const label = row.player_name ? row.player_name + " · " : "";
    title.textContent = Number(row.time).toFixed(3) + " s · " + label + (row.champion ?? "Unknown");
    const caption = document.createElement("p");
    caption.textContent = [row.identity_source, row.backfilled ? "Backfilled" : "", row.reason].filter(Boolean).join(" · ");
    article.append(title, caption);
    for (const kind of ["body", "mask"]) {
      const image = document.createElement("img");
      image.alt = kind === "body" ? "Tracked source crop" : "Foreground mask";
      image.src = "/body-identities/evidence/" + encodeURIComponent(row.id) + "/" + kind;
      image.onerror = () => image.remove();
      article.append(image);
    }
    const detail = document.createElement("details");
    const summary = document.createElement("summary");
    summary.textContent = "Recognition evidence";
    const evidence = document.createElement("pre");
    evidence.textContent = JSON.stringify({
      observation: row,
      binding: result.bindings.find(item => item.id === row.binding_id),
      roster: result.rosters.find(item => item.id === row.roster_id)
    }, null, 2);
    detail.append(summary, evidence);
    article.append(detail);
    rows.append(article);
  }
}
document.querySelector("#query").addEventListener("submit", event => {
  event.preventDefault();
  source.currentTime = Number(time.value);
  load().catch(error => status.textContent = String(error));
});
document.querySelector("#use-video").addEventListener("click", () => {
  time.value = source.currentTime.toFixed(3);
  load().catch(error => status.textContent = String(error));
});
load().catch(error => status.textContent = String(error));
</script>
</html>
